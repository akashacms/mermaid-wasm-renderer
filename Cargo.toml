[package]
name = "mermaid-wasm-renderer"
# Version policy: track the mermaid-rs-renderer version this package embeds.
version = "0.3.1"
edition = "2021"
description = "WASM bindings for mermaid-rs-renderer: fast Mermaid-to-SVG rendering in Node.js without a browser"
license = "MIT"
repository = "https://github.com/akashacms/mermaid-wasm-renderer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
wasm-bindgen = "0.2"
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
